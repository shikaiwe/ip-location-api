[project]
name = "ip-location-api"
version = "1.0.0"
description = "高性能IP定位API服务"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[full]>=0.27.0",
    "py-ip2region>=3.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "ipip-ipdb>=1.6.0",
    "cachetools>=5.3.0",
    "orjson>=3.9.0",
    "msgpack>=1.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.26.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
